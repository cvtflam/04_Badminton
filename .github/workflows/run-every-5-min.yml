name: Generate and Commit CSV

on:
  workflow_dispatch: # enable manual trigger

jobs:
  generate-and-commit-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas requests python-dotenv

      - name: Generate CSV
        env:
          URL: "https://data.smartplay.lcsd.gov.hk/rest/cms/api/v1/publ/contents/open-data/badminton/file"
          OUTPUT_PATH: "output/"
          TZ: "Asia/Hong_Kong"

- name: Commit and Push to data_collection
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git fetch origin data_collection || true
          git checkout -B data_collection origin/data_collection || git checkout -b data_collection

          mkdir -p output
          cp -r /tmp/csv_backup/* output/

          git add output/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add court snapshot [skip ci]"
            git push origin data_collection
          fi

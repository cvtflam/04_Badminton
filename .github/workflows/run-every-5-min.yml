name: Generate and Commit CSV

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  generate-and-commit-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true  # Prevents Git LFS pointer errors

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas requests python-dotenv

      - name: Generate CSV
        env:
          URL: "https://data.smartplay.lcsd.gov.hk/rest/cms/api/v1/publ/contents/open-data/badminton/file"
          OUTPUT_PATH: "output/"
          TZ: "Asia/Hong_Kong" 
        run: python "src/Badminton court list_5min.py"

      - name: Commit and Push to data_collection
        env:
          TZ: "Asia/Hong_Kong" 
        run: |
          # 1. Stash generated CSV files
          git stash push -m "new-data" -- output/*

          # 2. Configure Git bot
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 3. Switch cleanly to data_collection branch
          git fetch origin data_collection || true
          git checkout data_collection || git checkout -b data_collection

          # 4. Apply stashed CSV files on top of data_collection
          git stash pop || true

          # 5. Stage, commit, and push directly
          git add output/*
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update output CSV [skip ci]"
            git push origin data_collection
          fi

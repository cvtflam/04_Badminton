name: Generate and Commit CSV

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # enable manual trigger

jobs:
  generate-and-commit-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas requests python-dotenv

      - name: Generate CSV
        env:
          URL: "https://data.smartplay.lcsd.gov.hk/rest/cms/api/v1/publ/contents/open-data/badminton/file"
          OUTPUT_PATH: "output/"
          TZ: "Asia/Hong_Kong" 
        run: python "src/Badminton court list_5min.py"

      - name: Commit and Push files
        env:
          TZ: "Asia/Hong_Kong" 
        run: |
          git config --local user.email "41898282+github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add output/*
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add changes"
            git push origin HEAD:refs/heads/data_collection_no_lfs
          fi
